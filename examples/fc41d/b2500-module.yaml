# ESPHome for the Wi-Fi module inside a B2500 (Quectel FC41D, BK7231N).
#
# Replaces the module's Quectel AT firmware. The battery MCU keeps talking AT
# on the module's main UART and hame_at answers it:
#   - Wi-Fi is ESPHome's (set it below; the app's Wi-Fi setup is ignored),
#   - the battery's Bluetooth service stays available to the Marstek app,
#   - the battery's MQTT session ends on the module; with cloud access on
#     (default) it is also forwarded to the Hame cloud with the battery's own
#     broker, credentials and certificates, so the app works remotely;
#     `cloud_access` picks per kind of traffic what is passed through and
#     what the module answers itself (Marsrelay-style),
#   - every status message the battery publishes fires on_mcu_publish.
#
# Status: untested on a real battery. Formats and timing follow the hm2500
# firmware emulator (the real MCU images run against a module model) until
# UART captures from a stock module confirm them.
#
# Before flashing a battery's module, back it up and copy its BLE MAC into
# `ble_mac` (the battery derives its device id from it):
#   ltchiptool flash read bk7231n fc41d-<serial>.bin
#
# On the FC41D-TE-B eval kit the same file works: J201 (main UART) plays the
# battery MCU (tools/fc41d_mcu_sim.py), logs are on J202.

substitutions:
  name: b2500-module
  # The stock module's BLE address (from the backup / a UART capture).
  ble_mac: "AA:BB:CC:DD:EE:FF"

esphome:
  name: ${name}
  platformio_options:
    # uart.rx_buffer_size is ignored on bk72xx; the MCU sends long AT lines
    # (status ~550 bytes, certificates ~1.7 KB). LibreTiny allocates this
    # buffer on the heap for every UART it opens (the logger's too), so it is
    # 4 KB, not more: about 350 ms of uninterrupted MCU traffic.
    build_flags:
      - -DLT_SERIAL_BUFFER_SIZE=4096

bk72xx:
  board: generic-bk7231n-qfn32

external_components:
  - source:
      type: local
      path: ../../components
    components: [bk72xx_ble_server, hame_at, hame_device]

logger:
  level: DEBUG
  # UART1 (P10/P11, the module's main UART) belongs to the battery MCU.
  hardware_uart: UART2

api:

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: ${name}

captive_portal:

time:
  - platform: sntp
    id: sntp_time

uart:
  id: mcu_uart
  tx_pin: P11
  rx_pin: P10
  baud_rate: 115200

bk72xx_ble:

bk72xx_ble_server:
  id: ble_server
  # Replaced by the name the battery sets (AT+QBLENAME) before advertising.
  name: B2500
  service_uuid: 0xFF00
  # Advertise with the stock module's BLE address, as the battery's app knows it.
  mac_address: ${ble_mac}
  # As the stock module creates them (AT+QBLEGATTSCHAR): write + notify each.
  characteristics:
    - uuid: 0xFF01
      write: true
      notify: true
    - uuid: 0xFF02
      write: true
      notify: true
    - uuid: 0xFF06
      write: true
      notify: true

hame_at:
  id: module
  uart_id: mcu_uart
  ble_server_id: ble_server
  time_id: sntp_time
  ble_mac: ${ble_mac}
  # Cloud access (also the "Cloud access" switch). Off: the module answers
  # everything itself, like Marsrelay; the Marstek app then only works over
  # Bluetooth.
  cloud: true
  # While cloud access is on, per kind of traffic:
  #   forward - pass through to the Hame cloud
  #   local   - answer on the module (Marsrelay-compatible)
  #   auto    - pass through, answer locally when the cloud fails (HTTP only)
  cloud_access:
    mqtt: forward          # app control and cloud data (forward / local)
    time: auto             # the battery's clock
    device_config: auto    # output limits, SOC, schedules
    reports: forward       # statistics and error uploads
  allow_mcu_ota: false     # let the cloud update the battery's firmware
  on_mcu_publish:
    - lambda: |-
        // Device status replies ("p1=..,p2=..,w1=..") arrive on the device topic.
        if (topic.find("/device/") != std::string::npos)
          id(battery_status).publish_state(payload);

# The battery as Home Assistant entities: a hame_device hub on the MCU's MQTT
# session, plus the device profile for the B2500 v2 (it adds the message
# types, sensors and controls to this hub). Keep the list form ("- id:"): the
# profiles extend this entry.
hame_device:
  - id: battery
    hame_at_id: module

packages:
  b2500: !include {file: devices/b2500-v2.yaml, vars: {device: battery}}
  # Optional add-ons (one more request each per minute):
  # b2500_electrical: !include {file: devices/b2500-v2-electrical.yaml, vars: {device: battery}}
  # b2500_cells: !include {file: devices/b2500-v2-cells.yaml, vars: {device: battery}}

switch:
  - platform: hame_at
    cloud:
      name: Cloud access

text_sensor:
  - platform: hame_at
    cloud_status:
      name: Cloud status
  - platform: template
    id: battery_status
    name: Battery status (raw)
    entity_category: diagnostic
    disabled_by_default: true

sensor:
  - platform: debug
    free:
      name: Heap free
    # "block" (largest free block) is always 0 on BK72xx: LibreTiny does
    # not implement it. The lowest free heap since boot shows the headroom.
    min_free:
      name: Heap min free

debug:
  update_interval: 30s

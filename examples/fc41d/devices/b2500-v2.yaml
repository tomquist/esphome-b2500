      "1": "Phase 2"
      "2": "Phase 3"
      "3": "All Phases"
      "255": "Auto-detect"

  - platform: hame_device
    hame_device_id: ${device}
    name: "Recharge Mode"
    key: "dchrg_t"
    message: "ct_diagnosis"
    command: "cd=27,dchrg={value}"
    options:
      "0": "Single Phase"
      "1": "Three Phase"

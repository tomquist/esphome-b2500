      "0": "Day"
      "1": "Night"
      "2": "Dusk/Dawn"

  - platform: hame_device
    hame_device_id: ${device}
    name: "CT Status"
    key: "c1"
    map:
      "5": "Preparing to diagnose CT001 (Step 1)"
      "6": "Preparing to diagnose CT001 (Step 2)"
      "7": "Diagnosing CT001 equipment"
      "8": "Diagnosing CT001 channel"
      "9": "Diagnosis timeout"
      "10": "Charging in progress"
      "11": "Unable to find channel"
      "12": "Full battery: PV pass-through"
    default: "Not in diagnosis"

  - platform: hame_device
    hame_device_id: ${device}
    name: "CT Type"
    key: "ct_t"
    map:
      "1": "CT001"
      "2": "CT001.5"
      "3": "CT002"
      "4": "Shelly Pro 3EM"
      "5": "P1 Meter"
      "6": "CT003"
      "7": "Shelly EM Gen3"
      "8": "Shelly Pro EM50"
      "9": "EcoTracker"
      "10": "SMR-P1"
      "11": "SMR-IR"
      "12": "SMR-TIC"
      "13": "TPM2-100CT"
    default: "None"
    disabled_by_default: true

  - platform: hame_device
    hame_device_id: ${device}
    name: "Phase Detection"
    key: "seq_s"
    message: "ct_diagnosis"
    map:
      "0": "Idle"
      "1": "Detecting"
      "2": "Failed"
      "3": "Done"
    icon: "mdi:sine-wave"
    disabled_by_default: true

  - platform: hame_device
    hame_device_id: ${device}
    name: "Device Firmware (FC)"
    key: "fc"
    entity_category: "diagnostic"
    disabled_by_default: true


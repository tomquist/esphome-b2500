# Marstek B2500 v2 add-on: input, output and battery voltages/currents (cd=16).
# Generated by tools/gen_b2500_profiles.py from hm2mqtt's device definition;
# edit the generator, not this file.
#
# Use as a package on a hame_device hub you define yourself:
#   packages:
#     b2500_electrical: !include {file: devices/b2500-v2-electrical.yaml, vars: {device: battery}}

hame_device:
  - id: !extend ${device}
    messages:
      - name: electrical
        required_keys: [bb, bv, bc, sb, sv, sc, lb, lv, lc]
        poll: "cd=16"
        interval: 60s

sensor:
  - platform: hame_device
    hame_device_id: ${device}
    name: "Input Voltage 1"
    key: "m1"
    message: "electrical"
    multiply: 0.001
    unit_of_measurement: "V"
    device_class: "voltage"
    state_class: "measurement"
    accuracy_decimals: 2

  - platform: hame_device
    hame_device_id: ${device}
    name: "Input Voltage 2"
    key: "m2"
    message: "electrical"
    multiply: 0.001
    unit_of_measurement: "V"
    device_class: "voltage"
    state_class: "measurement"
    accuracy_decimals: 2

  - platform: hame_device
    hame_device_id: ${device}
    name: "Input Current 1"
    key: "c1"
    message: "electrical"
    multiply: 0.001
    unit_of_measurement: "A"
    device_class: "current"
    state_class: "measurement"
    accuracy_decimals: 2

  - platform: hame_device
    hame_device_id: ${device}

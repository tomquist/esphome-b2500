name: Build ESPHome Firmware
run-name: >
  B2500 [${{
    github.event.client_payload.identifier &&
    github.event.client_payload.identifier || 'N/A' }}]

on:
  repository_dispatch:
    types:
      - build_esphome

jobs:
  build_esphome:
    runs-on: ubuntu-latest
    env:
      ENCRYPTED_ZIP_PASSWORD: ${{ github.event.client_payload.password }}
      ENCRYPTED_CONFIG: ${{ github.event.client_payload.config }}
      PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
      S3_BUCKET: esphome-b2500-images
      AWS_REGION: eu-west-1
      AUTOMATED_BUILD: 'true'
      IDENTIFIER: ${{ github.event.client_payload.identifier }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # The identifier ends up in an S3 object key and in shell commands, so it
      # has to match what the web builder generates.
      - name: Validate the build identifier
        run: |
          if [[ ! "$IDENTIFIER" =~ ^[a-z0-9-]{1,64}$ ]]; then
            echo "::error::Invalid build identifier"
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm install nunjucks

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v1
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      # The web builder polls this document to follow the build and to offer
      # flashing the firmware right after it finished.
      - name: Publish build status
        run: ./scripts/publish-build-status.sh building

      - name: Decrypt the ZIP password
        id: decrypt_password
        run: |
          echo "${{ env.PRIVATE_KEY }}" > private_key.pem
          echo "${{ env.ENCRYPTED_ZIP_PASSWORD }}" > encrypted_password.txt
          DECRYPTED_PASSWORD=$(openssl rsautl -decrypt -inkey private_key.pem -in <(base64 -d encrypted_password.txt) -oaep)
          echo "PASSWORD=$DECRYPTED_PASSWORD" >> $GITHUB_ENV
          echo "::add-mask::$DECRYPTED_PASSWORD"

      - name: Install yq
        run: |
          wget https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64 -O /usr/local/bin/yq
          chmod +x /usr/local/bin/yq
        shell: bash
      
      - name: Render ESPHome configuration
        id: generate_config
        run: |
          node scripts/render.js

      - name: Build firmware
        id: esphome-build
        uses: esphome/build-action@v7.1.0
        with:
          yaml-file: device.yaml
          version: ${{ github.event.client_payload.esphome_version || '2026.8.1' }}
          # Required so that the browser can flash the firmware without having
          # to assemble an esp-web-tools manifest itself.
          complete-manifest: true
        continue-on-error: true

      - name: Debug on failure
        if: steps.esphome-build.outcome == 'failure'
        run: |
          echo "Build failed"
          echo "::group::Original Config File"
          cat config.json
          echo "::endgroup::"

      - name: Exit on build failure  
        if: steps.esphome-build.outcome == 'failure'
        run: exit 1

      - name: Zip the firmware with a password
        run: |
          zip -P "$PASSWORD" firmware.zip ${{ steps.esphome-build.outputs.name }}/*

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: esphome-firmware-${{ env.IDENTIFIER }}
          path: firmware.zip

      - name: Upload firmware to S3
        run: |
          aws s3 cp firmware.zip "s3://$S3_BUCKET/firmware/$IDENTIFIER.zip"

      - name: Publish build result
        env:
          FIRMWARE_URL: https://${{ env.S3_BUCKET }}.s3.${{ env.AWS_REGION }}.amazonaws.com/firmware/${{ env.IDENTIFIER }}.zip
          FIRMWARE_NAME: ${{ steps.esphome-build.outputs.name }}
          ESPHOME_VERSION: ${{ steps.esphome-build.outputs.version }}
        run: ./scripts/publish-build-status.sh success

      - name: Output firmware URL
        run: |
          echo "::notice::Firmware available at: https://$S3_BUCKET.s3.${{ env.AWS_REGION }}.amazonaws.com/firmware/$IDENTIFIER.zip"

      - name: Publish build failure
        if: failure()
        continue-on-error: true
        run: |
          ./scripts/publish-build-status.sh error \
            "The firmware build failed. Please check the build log and open an issue with your configuration."

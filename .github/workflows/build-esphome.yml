name: Build ESPHome Firmware
run-name: >
  B2500 [${{
    github.event.client_payload.identifier &&
    github.event.client_payload.identifier || 'N/A' }}]

on:
  repository_dispatch:
    types:
      - build_esphome

# The dispatch endpoint is public, so the same identifier can be submitted more
# than once. Serialising per identifier keeps two runs from interleaving their
# writes to the same firmware and status objects.
concurrency:
  group: build-esphome-${{ github.event.client_payload.identifier }}
  cancel-in-progress: false

jobs:
  build_esphome:
    runs-on: ubuntu-latest
    env:
      ENCRYPTED_CONFIG: ${{ github.event.client_payload.config }}
      # The browser's ephemeral public key. Public material, so unlike the
      # password it replaces there is nothing here to protect.
      CLIENT_PUBLIC_KEY: ${{ github.event.client_payload.public_key }}
      S3_BUCKET: esphome-b2500-images
      AWS_REGION: eu-west-1
      AUTOMATED_BUILD: 'true'
      IDENTIFIER: ${{ github.event.client_payload.identifier }}
      # Pinned rather than read from the dispatch payload. The build action
      # splices this straight into a docker tag and a shell command, and which
      # config keys ESPHome honours (platform_version, among others) differs
      # per version, so letting a requester choose it hands them both a shell
      # context and a pick of ESPHome's validation behaviour.
      ESPHOME_VERSION: '2026.8.1'
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # The identifier ends up in an S3 object key and in shell commands, so it
      # has to match what the web builder generates. The public key is checked
      # properly where it is parsed (scripts/buildCrypto.js, which also rejects
      # a point that is not on the curve); this is only so a malformed payload
      # fails before the job spends five minutes on a compile.
      - name: Validate the dispatch payload
        run: |
          if [[ ! "$IDENTIFIER" =~ ^[a-z0-9-]{1,64}$ ]]; then
            echo "::error::Invalid build identifier"
            exit 1
          fi
          if [[ ! "$CLIENT_PUBLIC_KEY" =~ ^[A-Za-z0-9+/]{86}==$ ]]; then
            echo "::error::Invalid build public key"
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      # From the lockfile, so nunjucks is the reviewed version rather than
      # whatever the registry resolves today, and without lifecycle scripts:
      # this job holds the AWS credentials and the build private key.
      - name: Install dependencies
        run: npm ci --omit=dev --ignore-scripts

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      # The web builder polls this document to follow the build and to offer
      # flashing the firmware right after it finished.
      - name: Publish build status
        env:
          STEP: preparing
        run: ./scripts/publish-build-status.sh building "Preparing the build" || true

      # The only step that needs the repo's private key: it derives the config
      # key from it and the requester's public key, in node rather than in the
      # shell, so no secret is ever written to GITHUB_ENV.
      - name: Render ESPHome configuration
        id: generate_config
        env:
          BUILD_PRIVATE_KEY: ${{ secrets.BUILD_PRIVATE_KEY }}
        run: |
          node scripts/render.js

      # The compile is by far the longest part of a build, so a watcher reports
      # how far along it is while the step below runs. It keeps going until the
      # step after the build stops it.
      - name: Report compile progress
        env:
          STEP: compiling
        run: |
          ./scripts/publish-build-status.sh building "Compiling the firmware" || true
          rm -f progress-watcher.stop
          nohup ./scripts/watch-build-progress.sh > progress-watcher.log 2>&1 &
          echo "PROGRESS_WATCHER_PID=$!" >> "$GITHUB_ENV"

      - name: Build firmware
        id: esphome-build
        uses: esphome/build-action@v7.1.0
        with:
          yaml-file: device.yaml
          version: ${{ env.ESPHOME_VERSION }}
          # Required so that the browser can flash the firmware without having
          # to assemble an esp-web-tools manifest itself.
          complete-manifest: true
        continue-on-error: true

      # Before any of the paths below publish a status of their own, so that a
      # late progress update cannot overwrite the build result. The watcher only
      # stops between polls, so waiting for it to exit means any upload it had
      # in flight has finished rather than racing the status published next.
      - name: Stop reporting compile progress
        if: always()
        run: |
          touch progress-watcher.stop
          if [[ -n "${PROGRESS_WATCHER_PID:-}" ]]; then
            for _ in $(seq 60); do
              kill -0 "$PROGRESS_WATCHER_PID" 2> /dev/null || break
              sleep 1
            done
            # Only reached if an upload hung well past its own timeout.
            kill "$PROGRESS_WATCHER_PID" 2> /dev/null || true
          fi
          if [[ -s progress-watcher.log ]]; then
            echo "::group::Compile progress reporting"
            cat progress-watcher.log
            echo "::endgroup::"
          fi

      # Logs on a public repository are world readable, and the config holds
      # the requester's SSID, MQTT broker and username. The redacted form keeps
      # the shape and the feature flags, which is what a failed build needs.
      - name: Debug on failure
        if: steps.esphome-build.outcome == 'failure'
        run: |
          echo "Build failed"
          echo "::group::Config (redacted)"
          node scripts/redactConfig.js config.json
          echo "::endgroup::"

      - name: Exit on build failure  
        if: steps.esphome-build.outcome == 'failure'
        run: exit 1

      - name: Publish packaging status
        env:
          STEP: packaging
        run: ./scripts/publish-build-status.sh building "Packaging the firmware" || true

      # A plain ZIP, encrypted as a whole below. `zip -P` uses PKWARE's stream
      # cipher, which a dozen bytes of known plaintext break - and a firmware
      # archive is nearly all bytes an attacker can reproduce by running a build
      # of their own at the pinned ESPHome version.
      - name: Package and encrypt the firmware
        env:
          FIRMWARE_NAME: ${{ steps.esphome-build.outputs.name }}
        run: |
          if [[ ! "$FIRMWARE_NAME" =~ ^[a-z0-9_-]+$ ]]; then
            echo "::error::Unexpected firmware name"
            exit 1
          fi
          zip firmware.zip "$FIRMWARE_NAME"/*
          # Sealed to the requester's public key under a throwaway key pair, so
          # this step needs no secret and the runner cannot read the result.
          node scripts/encryptFirmware.js firmware.zip firmware.zip.enc
          # The firmware carries the requester's WiFi and MQTT credentials, and
          # artifacts on a public repository are public.
          rm -f firmware.zip

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: esphome-firmware-${{ env.IDENTIFIER }}
          path: firmware.zip.enc

      - name: Upload firmware to S3
        run: |
          aws s3 cp firmware.zip.enc "s3://$S3_BUCKET/firmware/$IDENTIFIER.zip.enc"

      - name: Publish build result
        env:
          FIRMWARE_URL: https://${{ env.S3_BUCKET }}.s3.${{ env.AWS_REGION }}.amazonaws.com/firmware/${{ env.IDENTIFIER }}.zip.enc
          FIRMWARE_NAME: ${{ steps.esphome-build.outputs.name }}
          ESPHOME_VERSION: ${{ steps.esphome-build.outputs.version }}
        run: ./scripts/publish-build-status.sh success

      - name: Output firmware URL
        run: |
          echo "::notice::Firmware available at: https://$S3_BUCKET.s3.${{ env.AWS_REGION }}.amazonaws.com/firmware/$IDENTIFIER.zip.enc"

      - name: Publish build failure
        if: failure()
        continue-on-error: true
        run: |
          ./scripts/publish-build-status.sh error \
            "The firmware build failed. Please check the build log and open an issue with your configuration."

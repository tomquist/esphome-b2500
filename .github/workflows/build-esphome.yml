name: Build ESPHome Firmware
run-name: >
  B2500 [${{
    github.event.client_payload.identifier &&
    github.event.client_payload.identifier || 'N/A' }}]

on:
  repository_dispatch:
    types:
      - build_esphome

jobs:
  build_esphome:
    runs-on: ubuntu-latest
    env:
      ENCRYPTED_ZIP_PASSWORD: ${{ github.event.client_payload.password }}
      ENCRYPTED_CONFIG: ${{ github.event.client_payload.config }}
      PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
      S3_BUCKET: esphome-b2500-images
      AWS_REGION: eu-west-1
      AUTOMATED_BUILD: 'true'
      IDENTIFIER: ${{ github.event.client_payload.identifier }}
      ESPHOME_VERSION: ${{ github.event.client_payload.esphome_version || '2026.8.1' }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # The identifier ends up in an S3 object key and in shell commands, so it
      # has to match what the web builder generates.
      - name: Validate the build identifier
        run: |
          if [[ ! "$IDENTIFIER" =~ ^[a-z0-9-]{1,64}$ ]]; then
            echo "::error::Invalid build identifier"
            exit 1
          fi
          # esphome_version also comes from the dispatch payload and is passed
          # to the build action, so constrain it to a plain version or "latest".
          if [[ ! "$ESPHOME_VERSION" =~ ^(latest|[0-9]{4}\.[0-9]{1,2}\.[0-9]{1,2})$ ]]; then
            echo "::error::Invalid ESPHome version"
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm install nunjucks

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      # The web builder polls this document to follow the build and to offer
      # flashing the firmware right after it finished.
      - name: Publish build status
        env:
          STEP: preparing
        run: ./scripts/publish-build-status.sh building "Preparing the build" || true

      - name: Decrypt the ZIP password
        id: decrypt_password
        run: |
          # PRIVATE_KEY and ENCRYPTED_ZIP_PASSWORD are read from the environment
          # (set at job level) rather than interpolated with ${{ }}. The
          # encrypted password comes straight from the repository dispatch
          # payload and is fully attacker controlled, so it must never be
          # spliced into the script text where $(...) or backticks would run.
          printf '%s\n' "$PRIVATE_KEY" > private_key.pem
          printf '%s' "$ENCRYPTED_ZIP_PASSWORD" > encrypted_password.txt
          DECRYPTED_PASSWORD=$(openssl rsautl -decrypt -inkey private_key.pem -in <(base64 -d encrypted_password.txt) -oaep)
          echo "::add-mask::$DECRYPTED_PASSWORD"
          echo "PASSWORD=$DECRYPTED_PASSWORD" >> "$GITHUB_ENV"

      - name: Install yq
        run: |
          wget https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64 -O /usr/local/bin/yq
          chmod +x /usr/local/bin/yq
        shell: bash
      
      - name: Render ESPHome configuration
        id: generate_config
        run: |
          node scripts/render.js

      # The compile is by far the longest part of a build, so a watcher reports
      # how far along it is while the step below runs. It keeps going until the
      # step after the build stops it.
      - name: Report compile progress
        env:
          STEP: compiling
        run: |
          ./scripts/publish-build-status.sh building "Compiling the firmware" || true
          rm -f progress-watcher.stop
          nohup ./scripts/watch-build-progress.sh > progress-watcher.log 2>&1 &
          echo "PROGRESS_WATCHER_PID=$!" >> "$GITHUB_ENV"

      - name: Build firmware
        id: esphome-build
        uses: esphome/build-action@v7.1.0
        with:
          yaml-file: device.yaml
          version: ${{ env.ESPHOME_VERSION }}
          # Required so that the browser can flash the firmware without having
          # to assemble an esp-web-tools manifest itself.
          complete-manifest: true
        continue-on-error: true

      # Before any of the paths below publish a status of their own, so that a
      # late progress update cannot overwrite the build result. The watcher only
      # stops between polls, so waiting for it to exit means any upload it had
      # in flight has finished rather than racing the status published next.
      - name: Stop reporting compile progress
        if: always()
        run: |
          touch progress-watcher.stop
          if [[ -n "${PROGRESS_WATCHER_PID:-}" ]]; then
            for _ in $(seq 60); do
              kill -0 "$PROGRESS_WATCHER_PID" 2> /dev/null || break
              sleep 1
            done
            # Only reached if an upload hung well past its own timeout.
            kill "$PROGRESS_WATCHER_PID" 2> /dev/null || true
          fi
          if [[ -s progress-watcher.log ]]; then
            echo "::group::Compile progress reporting"
            cat progress-watcher.log
            echo "::endgroup::"
          fi

      - name: Debug on failure
        if: steps.esphome-build.outcome == 'failure'
        run: |
          echo "Build failed"
          echo "::group::Original Config File"
          cat config.json
          echo "::endgroup::"

      - name: Exit on build failure  
        if: steps.esphome-build.outcome == 'failure'
        run: exit 1

      - name: Publish packaging status
        env:
          STEP: packaging
        run: ./scripts/publish-build-status.sh building "Packaging the firmware" || true

      - name: Zip the firmware with a password
        env:
          FIRMWARE_NAME: ${{ steps.esphome-build.outputs.name }}
        run: |
          if [[ ! "$FIRMWARE_NAME" =~ ^[a-z0-9_-]+$ ]]; then
            echo "::error::Unexpected firmware name"
            exit 1
          fi
          zip -P "$PASSWORD" firmware.zip "$FIRMWARE_NAME"/*

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: esphome-firmware-${{ env.IDENTIFIER }}
          path: firmware.zip

      - name: Upload firmware to S3
        run: |
          aws s3 cp firmware.zip "s3://$S3_BUCKET/firmware/$IDENTIFIER.zip"

      - name: Publish build result
        env:
          FIRMWARE_URL: https://${{ env.S3_BUCKET }}.s3.${{ env.AWS_REGION }}.amazonaws.com/firmware/${{ env.IDENTIFIER }}.zip
          FIRMWARE_NAME: ${{ steps.esphome-build.outputs.name }}
          ESPHOME_VERSION: ${{ steps.esphome-build.outputs.version }}
        run: ./scripts/publish-build-status.sh success

      - name: Output firmware URL
        run: |
          echo "::notice::Firmware available at: https://$S3_BUCKET.s3.${{ env.AWS_REGION }}.amazonaws.com/firmware/$IDENTIFIER.zip"

      - name: Publish build failure
        if: failure()
        continue-on-error: true
        run: |
          ./scripts/publish-build-status.sh error \
            "The firmware build failed. Please check the build log and open an issue with your configuration."

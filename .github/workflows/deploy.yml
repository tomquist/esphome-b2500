name: Build and Deploy

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    # The whole job is seconds of work. Without this a hung step burns six hours
    # of Actions minutes before GitHub gives up - which is what happened when
    # `node --test` stopped after printing its TAP header and left two orphaned
    # children behind.
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      REACT_APP_S3_BUCKET: esphome-b2500-images
      REACT_APP_AWS_REGION: eu-west-1
      # The public half of the build key pair. A repository variable rather
      # than a constant in the source, so rotating the pair (see
      # scripts/generateBuildKeypair.js) needs no code change.
      REACT_APP_BUILD_PUBLIC_KEY: ${{ vars.BUILD_PUBLIC_KEY }}
    steps:
    - name: Checkout repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Setup Node.js
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: '18'

    - name: Install dependencies
      run: npm ci

    # react-scripts type-checks only what the webpack graph reaches, and jest
    # strips types with babel rather than checking them, so without this a test
    # file can carry a type error indefinitely.
    - name: Typecheck
      run: npm run typecheck

    - name: Run frontend tests
      run: npm test -- --watchAll=false

    # Serially, and as its own step. Run in parallel these hung on the CI runner
    # after printing the TAP header, with no test ever reporting and two node
    # children orphaned - not reproducible here on either Node 18 or 22, at any
    # concurrency. Serial execution removes the variable; the split means a
    # recurrence names which half is at fault rather than pointing at both.
    - name: Run script tests
      run: node --test --test-concurrency=1 scripts/*.test.mjs

    - name: Build the app
      run: npm run build
      env:
        REACT_APP_S3_BUCKET: ${{ env.REACT_APP_S3_BUCKET }}
        REACT_APP_AWS_REGION: ${{ env.REACT_APP_AWS_REGION }}
        REACT_APP_BUILD_PUBLIC_KEY: ${{ env.REACT_APP_BUILD_PUBLIC_KEY }}

    - name: Upload artifact
      if: github.event_name == 'push'
      uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
      with:
        path: ./build

  deploy:
    if: github.event_name == 'push'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

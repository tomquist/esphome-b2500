name: Build and Deploy

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      REACT_APP_S3_BUCKET: esphome-b2500-images
      REACT_APP_AWS_REGION: eu-west-1
      # The public half of the build key pair. A repository variable rather
      # than a constant in the source, so rotating the pair (see
      # scripts/generateBuildKeypair.js) needs no code change.
      REACT_APP_BUILD_PUBLIC_KEY: ${{ vars.BUILD_PUBLIC_KEY }}
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'

    - name: Install dependencies
      run: npm ci

    - name: Run tests
      run: |
        npm test -- --watchAll=false
        node --test scripts/*.test.mjs

    - name: Build the app
      run: npm run build
      env:
        REACT_APP_S3_BUCKET: ${{ env.REACT_APP_S3_BUCKET }}
        REACT_APP_AWS_REGION: ${{ env.REACT_APP_AWS_REGION }}
        REACT_APP_BUILD_PUBLIC_KEY: ${{ env.REACT_APP_BUILD_PUBLIC_KEY }}

    - name: Upload artifact
      if: github.event_name == 'push'
      uses: actions/upload-pages-artifact@v3
      with:
        path: ./build

  deploy:
    if: github.event_name == 'push'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
